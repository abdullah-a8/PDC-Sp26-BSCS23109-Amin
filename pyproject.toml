[project]
name = "pdc-sp26-bscs23109-amin"
version = "0.1.0"
description = "PDC Assignment 2 — Optimistic Locking fix for the Lost Update anomaly (Problem 1)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Abdullah Amin" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
